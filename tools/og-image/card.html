<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<!-- The share card for quvlo.co (1200x630). Same look as the homepage's opening screen: the night storefront,
     the Zodiak headline, the tungsten lamp colour. Render with: node tools/og-image/render.mjs (see that file). -->
<style>
  @font-face{font-family:'Zodiak';font-weight:700;src:url(../../public/fonts/zodiak-700.woff2) format('woff2');}
  @font-face{font-family:'Author';font-weight:500;src:url(../../public/fonts/author-500.woff2) format('woff2');}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1200px;height:630px;}
  body{background:#05070d;overflow:hidden;position:relative;color:#ece7dc;font-family:'Author',system-ui,sans-serif;font-weight:500;-webkit-font-smoothing:antialiased;}
  .pic{position:absolute;top:-40px;right:-150px;width:860px;height:815px;background:url(../../public/model/hook/d-crop.webp) center/cover no-repeat;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 34%);mask-image:linear-gradient(90deg,transparent 0,#000 34%);}
  /* the TV in the window carries AI lettering that doesn't read as words: dim it, as if the screen were off */
  .tv{position:absolute;left:747px;top:253px;width:87px;height:65px;background:radial-gradient(ellipse at 50% 50%,rgba(10,10,12,.9) 55%,rgba(10,10,12,.55) 80%,rgba(10,10,12,0) 100%);filter:blur(1.2px);border-radius:3px;}
  .shade{position:absolute;inset:0;background:linear-gradient(90deg,#05070d 0,#05070d 30%,rgba(5,7,13,.86) 44%,rgba(5,7,13,.25) 66%,rgba(5,7,13,0) 80%),linear-gradient(180deg,rgba(5,7,13,.5),rgba(5,7,13,0) 25%,rgba(5,7,13,0) 75%,rgba(5,7,13,.6));}
  .wrap{position:relative;height:100%;padding:58px 68px 54px;display:flex;flex-direction:column;}
  .mark{font-family:'Zodiak',Georgia,serif;font-weight:700;font-size:38px;letter-spacing:-.02em;line-height:1;}
  h1{margin-top:auto;font-family:'Zodiak',Georgia,serif;font-weight:700;font-size:80px;line-height:.98;letter-spacing:-.035em;max-width:600px;}
  .sub{margin-top:24px;font-size:24px;line-height:1.35;color:#d4d0c7;max-width:520px;}
  .foot{margin-top:34px;display:flex;align-items:center;gap:14px;font-size:21px;color:#f1b877;}
  .foot i{width:9px;height:9px;border-radius:50%;background:#f1b877;box-shadow:0 0 12px #f1b877;}
</style></head>
<body>
  <div class="pic"></div><div class="tv"></div><div class="shade"></div>
  <div class="wrap">
    <div class="mark">Quvlo</div>
    <h1>Your business, still working at 3&nbsp;am.</h1>
    <p class="sub">Websites, booking and the follow-ups behind them, by one studio in Dallas Fort&nbsp;Worth.</p>
    <div class="foot"><i></i>quvlo.co</div>
  </div>
</body></html>
