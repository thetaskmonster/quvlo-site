<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
  @font-face{font-family:'Bricolage Grotesque';font-weight:700;src:url(bricolage-grotesque-700.woff2) format('woff2');}
  @font-face{font-family:'Space Mono';font-weight:400;src:url(space-mono-400.woff2) format('woff2');}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1200px;height:630px;}
  body{background:#05070d;overflow:hidden;position:relative;
       font-family:'Bricolage Grotesque',system-ui,sans-serif;}

  /* Same grid and champagne glow the site uses, so a shared link looks like
     the page it opens rather than a separate piece of marketing. */
  .grid{position:absolute;inset:0;
    background-image:linear-gradient(rgba(184,200,224,.055) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(184,200,224,.055) 1px,transparent 1px);
    background-size:60px 60px;}
  .glow{position:absolute;width:900px;height:900px;right:-230px;top:-330px;border-radius:50%;
    background:radial-gradient(circle,rgba(230,210,168,.30) 0%,rgba(230,210,168,.10) 40%,transparent 70%);}
  .vign{position:absolute;inset:0;
    background:linear-gradient(102deg,#05070d 22%,rgba(5,7,13,.80) 46%,rgba(5,7,13,.34) 70%,transparent 92%);}

  .wrap{position:relative;height:100%;padding:64px 72px;display:flex;flex-direction:column;}

  .mark{font-size:40px;font-weight:700;color:#f2f5fa;letter-spacing:-.03em;line-height:1;}
  .mark i{color:#e6d2a8;font-style:normal;}
  .kicker{margin-top:12px;font-family:'Space Mono',monospace;font-size:15px;color:#8b96a8;
    letter-spacing:.26em;text-transform:uppercase;}

  h1{margin-top:auto;font-size:78px;font-weight:700;line-height:1.02;letter-spacing:-.035em;
     color:#f2f5fa;max-width:735px;}
  h1 b{color:#e6d2a8;font-weight:700;}
  .sub{margin-top:24px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    font-size:22px;line-height:1.45;color:#c3ccd9;max-width:660px;}

  .foot{margin-top:auto;padding-top:34px;display:flex;align-items:flex-end;justify-content:space-between;}
  .url{font-family:'Space Mono',monospace;font-size:21px;color:#e6d2a8;letter-spacing:.04em;}
  .free{font-family:'Space Mono',monospace;font-size:15px;color:#c3ccd9;letter-spacing:.13em;
    text-transform:uppercase;}

  /* The two scores are what the product actually outputs. Deliberately
     unnumbered: a specific score would read as a real client result, and
     there are none. */
  .gauges{position:absolute;right:72px;top:238px;width:296px;
    display:flex;flex-direction:column;gap:36px;}
  .g .lab{display:flex;justify-content:space-between;align-items:baseline;
    font-family:'Space Mono',monospace;font-size:14px;letter-spacing:.2em;text-transform:uppercase;}
  .g .lab span:first-child{color:#c3ccd9;}
  .g .lab span:last-child{color:#5f6a7c;font-size:12px;letter-spacing:.1em;}
  .g .bar{margin-top:13px;height:9px;border-radius:99px;background:rgba(184,200,224,.11);overflow:hidden;}
  .g .bar i{display:block;height:100%;border-radius:99px;}
  .g.h .bar i{width:74%;background:linear-gradient(90deg,#7ee0a8,#a8ecc6);}
  .g.a .bar i{width:39%;background:linear-gradient(90deg,#ff9b9b,#ffc2a8);}
  .rule{height:1px;background:rgba(184,200,224,.13);margin:4px 0 0;}
  .note{margin-top:16px;font-family:'Space Mono',monospace;font-size:12.5px;line-height:1.6;color:#5f6a7c;}
</style></head>
<body>
  <div class="grid"></div><div class="glow"></div><div class="vign"></div>

  <div class="gauges">
    <div class="g h"><div class="lab"><span>Human</span><span>Screen readers</span></div>
      <div class="bar"><i></i></div></div>
    <div class="g a"><div class="lab"><span>Agent</span><span>Booking bots</span></div>
      <div class="bar"><i></i></div></div>
  </div>

  <div class="wrap">
    <div>
      <div class="mark">Quvlo<i>.</i></div>
      <div class="kicker">Precision web studio &middot; Dallas Fort Worth</div>
    </div>

    <h1>Can an <b>AI agent</b> actually use your website?</h1>
    <p class="sub">Custom sites built so a screen reader and an AI agent can both finish a booking. ADA and EAA compliance by default.</p>

    <div class="foot">
      <div class="url">quvlo.co</div>
      <div class="free">Free teardown of your site</div>
    </div>
  </div>
</body></html>
